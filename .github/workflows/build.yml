name: Build ESPHome firmware

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- ① 默认固件：占位 WiFi，发布到 Release 供公共下载 ----------
      # 无论仓库是否配置 secrets 都会构建；不含任何个人 WiFi 凭据。
      - name: Build default firmware (placeholder WiFi)
        run: |
          echo 'wifi_ssid: "your_wifi_ssid"' > secrets.yaml
          echo 'wifi_password: "your_wifi_password"' >> secrets.yaml
          docker run --rm -v "${PWD}":/config -w /config esphome/esphome \
            compile esphome-phicomm-m1.yaml

      - name: Collect default firmware
        run: |
          mkdir -p dist
          cp .esphome/build/phicomm-m1/.pioenvs/phicomm-m1/firmware.bin dist/phicomm-m1.bin
          # UF2 与 bin 内容完全一致，仅容器不同；Release 只发 .bin 避免混淆，
          # 这里仍在 Actions artifact 里保留一份 .uf2 供需要的人取用。
          cp .esphome/build/phicomm-m1/.pioenvs/phicomm-m1/firmware.uf2 dist/phicomm-m1.uf2

      # ---------- ② 检查仓库是否配置 WIFI secrets ----------
      # GitHub Actions 不允许在 if: 中直接使用 secrets 上下文，
      # 因此先把"是否已配置"写入 step output，后续用 output 判断。
      - name: Check WIFI secrets
        id: wifi_secrets
        run: |
          if [ -n "${{ secrets.WIFI_SSID }}" ] && [ -n "${{ secrets.WIFI_PASSWORD }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------- ③ 个人固件：仅当仓库配置了 WIFI secrets 时构建 ----------
      # 带个人 WiFi 凭据，只上传 Actions artifact（30 天有效），不发布到 Release，
      # 避免凭据公开。
      - name: Build personal firmware (repo secrets)
        if: steps.wifi_secrets.outputs.configured == 'true'
        run: |
          rm -rf .esphome/build/phicomm-m1
          echo "wifi_ssid: \"${{ secrets.WIFI_SSID }}\"" > secrets.yaml
          echo "wifi_password: \"${{ secrets.WIFI_PASSWORD }}\"" >> secrets.yaml
          docker run --rm -v "${PWD}":/config -w /config esphome/esphome \
            compile esphome-phicomm-m1.yaml
          mkdir -p dist-personal
          cp .esphome/build/phicomm-m1/.pioenvs/phicomm-m1/firmware.bin dist-personal/phicomm-m1-personal.bin
          cp .esphome/build/phicomm-m1/.pioenvs/phicomm-m1/firmware.uf2 dist-personal/phicomm-m1-personal.uf2

      - name: Upload default firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phicomm-m1-firmware
          path: dist/

      - name: Upload personal firmware artifacts
        if: steps.wifi_secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phicomm-m1-personal-firmware
          path: dist-personal/

      # ---------- ④ 每次 push 到 master：发布滚动 Release 'latest'，无需打 tag ----------
      - name: Publish rolling release (latest)
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=latest
          # 幂等：删除上一次的滚动 release（连同 tag），不存在则忽略
          gh release delete "$TAG" --yes --cleanup-tag || true
          NOTES=$(cat <<'EOF'
## 斐讯 M1 ESPHome 固件（master 自动构建）

- `phicomm-m1.bin`：串口刷机用（`ltchiptool flash write` 直接写入）
- 默认固件（占位 WiFi），带首次配置向导，无需编译
- 需要 `.uf2` 时用 `ltchiptool uf2 --input phicomm-m1.bin --output phicomm-m1.uf2` 转换（内容完全一致）
- commit: ${{ github.sha }}
EOF
          )
          gh release create "$TAG" dist/phicomm-m1.bin \
            --title "最新构建 $(date -u +%Y%m%d-%H%M)" \
            --notes "$NOTES" \
            --latest

      # ---------- ⑤ 打 tag 时发布稳定版到 GitHub Release ----------
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/phicomm-m1.bin
          body: |
            ## 斐讯 M1 ESPHome 固件

            - `phicomm-m1.bin`：串口刷机用（`ltchiptool flash write` 直接写入）
            - 需要 `.uf2` 时用 `ltchiptool uf2 --input phicomm-m1.bin --output phicomm-m1.uf2` 转换
              （内容完全一致，仅容器不同）

            > ℹ️ 本 Release 是**默认固件**（WiFi 为占位符 `your_wifi_ssid` / `your_wifi_password`），
            > **内置首次配置向导**：连不上占位 WiFi 时自动开启配置热点 `phicomm-m1`
            > 手机连接后用网页填入自家 WiFi 即可保存联网，**无需编译**。
            > 详细步骤见仓库 README「默认固件免编译体验」。
            > 若仓库配置了 `WIFI_SSID` / `WIFI_PASSWORD` secrets，可在本次
            > Actions 运行记录的 artifacts 中下载带个人 WiFi 的 `*-personal` 固件。